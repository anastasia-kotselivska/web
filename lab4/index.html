<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Hunt</title>
  <style>
    body {
      margin: 0;
      padding: 8px;
      font-family: "Times New Roman", serif;
      height: 100vh;
      overflow: hidden;      
      position: relative;
    }
    h1 { text-align: center; margin: 0 20px 10px 0; }
    #info { display: none; }
    #target {
      position: absolute;   
      width: 40px;
      height: 40px;
      display: none;
      cursor: pointer;
      border: 1px solid rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
  <h1>Pixel Hunt</h1>

  <div id="controls">
    <label for="difficulty">Choose difficulty:</label>
    <select id="difficulty">
      <option value="">--Please choose an option--</option>
      <option value="10000">Lazy (10s)</option>
      <option value="5000">Normal (5s)</option>
      <option value="1000">Catch me if you can (1s)</option>
    </select>

    <label for="color">Choose color:</label>
    <select id="color">
      <option value="">--Please choose an option--</option>
      <option value="red">Red</option>
      <option value="green">Green</option>
      <option value="blue">Blue</option>
      <option value="yellow">Yellow</option>
      <option value="purple">Purple</option>
      <option value="orange">Orange</option>
      <option value="pink">Pink</option>
      <option value="cyan">Cyan</option>
    </select>

    <button id="start">Start</button>
  </div>

  <div id="info">
    <p>score: <span id="score">0</span></p>
    <p>time left for click: <span id="timeLeft">0</span></p>
  </div>

  <div id="target"></div>

  <script>
    const difficultySelect = document.getElementById('difficulty');
    const colorSelect = document.getElementById('color');
    const startBtn = document.getElementById('start');
    const controls = document.getElementById('controls');
    const info = document.getElementById('info');
    const scoreEl = document.getElementById('score');
    const timeLeftEl = document.getElementById('timeLeft');
    const target = document.getElementById('target');

    let score = 0;
    let timeLimit = 0;     
    let timeLeft = 0;
    let timerId = null;
    const TICK = 50;       

    function moveTarget() {
      const size = target.offsetWidth;
      const maxX = window.innerWidth - size;
      const maxY = window.innerHeight - size;
      target.style.left = Math.floor(Math.random() * maxX) + 'px';
      target.style.top = Math.floor(Math.random() * maxY) + 'px';
    }

    function resetTimer() {
      clearInterval(timerId);
      timeLeft = timeLimit;
      timeLeftEl.textContent = (timeLeft / 1000).toFixed(2);

      timerId = setInterval(() => {
        timeLeft -= TICK;
        if (timeLeft <= 0) {
          timeLeftEl.textContent = '0.00';
          endGame();
        } else {
          timeLeftEl.textContent = (timeLeft / 1000).toFixed(2);
        }
      }, TICK);
    }

    function startGame() {
      if (!difficultySelect.value || !colorSelect.value) {
        alert('Choose difficulty and color first!');
        return;
      }
      timeLimit = Number(difficultySelect.value);
      score = 0;
      scoreEl.textContent = score;

      target.style.backgroundColor = colorSelect.value;
      controls.style.display = 'none';
      info.style.display = 'block';
      target.style.display = 'block';

      moveTarget();
      resetTimer();
    }

    function onTargetClick() {
      score++;
      scoreEl.textContent = score;
      moveTarget();
      resetTimer();
    }

    function endGame() {
      clearInterval(timerId);
      target.style.display = 'none';
      alert('Game over! Your score: ' + score);
      info.style.display = 'none';
      controls.style.display = 'block';
    }

    startBtn.addEventListener('click', startGame);
    target.addEventListener('click', onTargetClick);
  </script>
</body>
</html>
