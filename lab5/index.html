<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Салон краси «Лілея»</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="#" id="nav-catalog">Catalog</a>
  </nav>

  <main id="content">
    <h1>Салон краси «Лілея»</h1>
    <p>Стрижки, манікюр, догляд за шкірою та SPA. Оберіть послугу в каталозі.</p>
  </main>
  <script src="ajax-utils.js"></script>
  <script>
 
  const content = document.getElementById('content');
  let categories = null;
  
  // Завантаження каталогу
  function loadCatalog() {
  
    content.textContent = 'Завантаження...';
  
    if (categories) {
      showCatalog();
      return;
    }
  
    ajaxUtils.sendGetRequest(
      'categories.json',
      function(data) {
        categories = data;
        showCatalog();
      },
      true
    );
  }
  
  // Відображення списку категорій
  function showCatalog() {
  
    content.replaceChildren();
  
    const title = document.createElement('h2');
    title.textContent = 'Каталог послуг';
    content.append(title);
  
    const list = document.createElement('ul');
  
    categories.forEach(function(cat) {
  
      const li = document.createElement('li');
      const link = document.createElement('a');
  
      link.href = '#';
      link.textContent = cat.name;
  
      link.onclick = function(e) {
        e.preventDefault();
        loadCategory(cat);
      };
  
      li.append(link);
      list.append(li);
    });
  
    // Випадкова категорія
    const li = document.createElement('li');
    const special = document.createElement('a');
  
    special.href = '#';
    special.textContent = 'Specials';
  
    special.onclick = function(e) {
      e.preventDefault();
  
      const index = Math.floor(
        Math.random() * categories.length
      );
  
      loadCategory(categories[index]);
    };
  
    li.append(special);
    list.append(li);
  
    content.append(list);
  }
  
  // Завантаження вибраної категорії
  function loadCategory(cat) {
  
    content.textContent = 'Завантаження...';
  
    ajaxUtils.sendGetRequest(
      cat.shortname + '.json',
      function(data) {
        showCategory(data);
      },
      true
    );
  }
  
  // Відображення послуг
  function showCategory(data) {
  
    content.replaceChildren();
  
    const title = document.createElement('h2');
    title.textContent = data.category;
    content.append(title);
  
    data.items.forEach(function(item) {
  
      const div = document.createElement('div');
      div.className = 'item';
  
      const img = document.createElement('img');
  
      img.src = 'https://placehold.co/200x200/e9def0/6b3a7d.png?text='
        + encodeURIComponent(item.shortname);
  
      img.alt = item.name;
      img.width = 200;
      img.height = 200;
  
      const info = document.createElement('div');
  
      const name = document.createElement('h3');
      name.textContent = item.name;
  
      const description = document.createElement('p');
      description.textContent = item.description;
  
      const price = document.createElement('p');
      price.textContent = item.price + ' грн';
      price.className = 'price';
  
      info.append(name, description, price);
      div.append(img, info);
  
      content.append(div);
    });
  }
  
  // Натискання Catalog
  document.getElementById('nav-catalog').onclick = function(e) {
    e.preventDefault();
    loadCatalog();
  };

  </script>
</body>
</html>
