<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Салон краси «Лілея»</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="#" id="nav-catalog">Catalog</a>
  </nav>

  <main id="content">
    <h1>Салон краси «Лілея»</h1>
    <p>Стрижки, манікюр, догляд за шкірою та SPA. Оберіть послугу в каталозі.</p>
  </main>

  <script>
    // Отримуємо основний блок сторінки
    const content = document.getElementById('content');
    // Шлях до JSON-файлів
    const DATA_DIR = "";
    // Змінна для збереження категорій
    let categories = null;

    // 1. Функція завантаження JSON через AJAX
    function getJSON(url) {
      return new Promise((resolve, reject) => {
        ajaxUtils.sendGetRequest(
          url,
          function(data) {
            resolve(data);
          },
          true,
          function(error) {
            reject(error);
          }
        );
      });
    }


    // 2. Функція створення HTML-елементів
    function el(tag, text, attrs = {}) {
      const node = document.createElement(tag);
      if (text) {
        node.textContent = text;
      }
      Object.entries(attrs).forEach(([k, v]) => {
        node.setAttribute(k, v);
      });
      return node;
    }

    // 3. Функція завантаження каталогу
    async function loadCatalog() {
      content.replaceChildren(
        el('p', 'Завантаження…')
      );
      try {
        if (!categories) {
          categories = await getJSON(
            DATA_DIR + 'categories.json'
          );
        }
        renderCatalog();
      } catch (err) {
        content.replaceChildren(
          el(
            'p',
            'Не вдалося завантажити каталог. ' + err.message
          )
        );
      }
    }
    // 4. Функція відображення каталогу
    function renderCatalog() {
      const list = el('ul');
      categories.forEach(cat => {
        const a = el('a', cat.name, {
          href: '#'
        });
        a.addEventListener('click', e => {
          e.preventDefault();
          loadCategory(cat);
        });
        const li = el('li');
        li.append(a);
        list.append(li);
      });
      // Випадковий вибір категорії Specials
      const specials = el('a', 'Specials', {
        href: '#'
      });
      specials.addEventListener('click', e => {
        e.preventDefault();
        if (categories.length > 0) {
          const randomIndex = Math.floor(
            Math.random() * categories.length
          );
          loadCategory(categories[randomIndex]);
        }
      });
      const li = el('li');
      li.append(specials);
      list.append(li);
      // Виводимо каталог на сторінку
      content.replaceChildren(
        el('h2', 'Каталог послуг'),
        list
      );
    }
    
    // 5. Функція завантаження вибраної категорії
    async function loadCategory(cat) {
      content.replaceChildren(
        el('p', 'Завантаження…')
      );
      try {
        const data = await getJSON(
          DATA_DIR + cat.shortname + '.json'
        );
        renderCategory(data);
      } catch (err) {
        content.replaceChildren(
          el(
            'p',
            'Не вдалося завантажити категорію. ' + err.message
          )
        );
      }
    }

    // 6. Функція відображення послуг категорії
    function renderCategory(data) {
      content.replaceChildren(
        el('h2', data.category)
      );
      data.items.forEach(item => {
        // Створення зображення
        const img = el('img', '', {
          src: 'https://placehold.co/200x200/e9def0/6b3a7d.png?text='
            + encodeURIComponent(item.shortname),
          alt: item.name,
          width: 200,
          height: 200
        });
        // Блок з інформацією про послугу
        const info = el('div');
        info.append(
          el('h3', item.name),
          el('p', item.description),
          el('p', item.price + ' грн', {
            class: 'price'
          })
        );
        // Загальний блок послуги
        const row = el('div', '', {
          class: 'item'
        });
        row.append(img, info);
        content.append(row);
      });
    }
    // 7. Обробник натискання Catalog
    document.getElementById('nav-catalog')
      .addEventListener('click', e => {
        e.preventDefault();
        loadCatalog();
      });
  </script>
</body>
</html>
